<svg viewBox="0 0 680 320" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>信息递进阶梯：三阶披露设计</title>
  <desc>第一阶名片层在递名片时提供基础信息；第二阶深聊层在双方同意进一步认识后互换照片、价值观与硬条件；第三阶见面层在约定线下前互换联系方式并附见面锦囊与安全提示。每阶升级都需双方同意且信息对称互换；身份证号、精确住址、精确收入、聊天记录永不收集。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text class="th" x="40" y="34" dominant-baseline="central">信息递进阶梯：三阶披露</text>
  <g class="c-gray">
    <rect x="45" y="160" width="185" height="100" rx="10" stroke-width="0.5"/>
    <text class="th" x="58" y="184" dominant-baseline="central">第一阶 · 名片层</text>
    <text class="ts" x="58" y="204" dominant-baseline="central">递名片 / 发广播时可见</text>
    <text class="ts" x="58" y="226" dominant-baseline="central">昵称 · 年龄段 · 城市 · 婚况</text>
    <text class="ts" x="58" y="244" dominant-baseline="central">职业大类 · 兴趣标签</text>
    <text class="ts" x="58" y="258" dominant-baseline="central">一句话自我介绍 · 目标声明</text>
  </g>
  <g class="c-red">
    <rect x="248" y="115" width="185" height="145" rx="10" stroke-width="0.5"/>
    <text class="th" x="261" y="139" dominant-baseline="central">第二阶 · 深聊层</text>
    <text class="ts" x="261" y="159" dominant-baseline="central">双方同意进一步认识后</text>
    <text class="ts" x="261" y="181" dominant-baseline="central">真实照片 1–3 张</text>
    <text class="ts" x="261" y="199" dominant-baseline="central">价值观问答与故事原文</text>
    <text class="ts" x="261" y="217" dominant-baseline="central">生活方式 · 家庭观 · 消费观</text>
    <text class="ts" x="261" y="235" dominant-baseline="central">房车等硬条件概况</text>
    <text class="ts" x="261" y="253" dominant-baseline="central">各自 dealbreakers 清单</text>
  </g>
  <g class="c-red">
    <rect x="451" y="70" width="185" height="190" rx="10" stroke-width="0.5"/>
    <rect x="451" y="70" width="185" height="190" rx="10" fill="#F7C1C1" opacity="0.35" stroke="none"/>
    <text class="th" x="464" y="94" dominant-baseline="central">第三阶 · 见面层</text>
    <text class="ts" x="464" y="114" dominant-baseline="central">约定线下见面之前</text>
    <text class="ts" x="464" y="136" dominant-baseline="central">微信号 / 手机号</text>
    <text class="ts" x="464" y="154" dominant-baseline="central">真实姓名 · 工作单位</text>
    <text class="ts" x="464" y="172" dominant-baseline="central">常去区域（到商圈为止）</text>
    <text class="ts" x="464" y="190" dominant-baseline="central">见面锦囊（话题准备）</text>
    <text class="ts" x="464" y="208" dominant-baseline="central">安全见面提示（自动附上）</text>
  </g>
  <line x1="232" y1="152" x2="246" y2="140" stroke="#A32D2D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="435" y1="107" x2="449" y2="95" stroke="#A32D2D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="ts" x="340" y="282" text-anchor="middle" dominant-baseline="central">每一阶升级都需双方同意 · 信息对称互换（你给多少，才能拿多少）</text>
  <text class="ts" x="340" y="302" text-anchor="middle" dominant-baseline="central">永不收集：身份证号 · 精确住址 · 精确收入数字 · 聊天记录</text>
</svg>