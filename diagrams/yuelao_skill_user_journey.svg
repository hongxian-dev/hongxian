<svg viewBox="0 0 680 290" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>月老 Skill 用户旅程：从安装到解锁的六个阶段</title>
  <desc>安装与知情同意、对话建画像、签发三层匹配卡、名片互换（第一次握手）、本地比对与双盲决策，随后按双方意愿分支：双方都愿意则第二次握手解锁联系方式，一方婉拒则静默无痕。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g class="c-gray">
    <rect x="40" y="50" width="104" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="92" y="72" text-anchor="middle" dominant-baseline="central">安装月老</text>
    <text class="ts" x="92" y="92" text-anchor="middle" dominant-baseline="central">知情同意·零收集</text>
  </g>
  <g class="c-red">
    <rect x="164" y="50" width="104" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="216" y="72" text-anchor="middle" dominant-baseline="central">对话建画像</text>
    <text class="ts" x="216" y="92" text-anchor="middle" dominant-baseline="central">渐进式多次会话</text>
  </g>
  <g class="c-red">
    <rect x="288" y="50" width="104" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="72" text-anchor="middle" dominant-baseline="central">签发匹配卡</text>
    <text class="ts" x="340" y="92" text-anchor="middle" dominant-baseline="central">公开/匹配/私密三层</text>
  </g>
  <g class="c-red">
    <rect x="412" y="50" width="104" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="464" y="72" text-anchor="middle" dominant-baseline="central">名片互换</text>
    <text class="ts" x="464" y="92" text-anchor="middle" dominant-baseline="central">扫码或传文件</text>
  </g>
  <g class="c-red">
    <rect x="536" y="50" width="104" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="588" y="72" text-anchor="middle" dominant-baseline="central">本地比对</text>
    <text class="ts" x="588" y="92" text-anchor="middle" dominant-baseline="central">各自独立出报告</text>
  </g>
  <line x1="144" y1="80" x2="162" y2="80" stroke="#A32D2D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="268" y1="80" x2="286" y2="80" stroke="#A32D2D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="392" y1="80" x2="410" y2="80" stroke="#A32D2D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="516" y1="80" x2="534" y2="80" stroke="#A32D2D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M588 110 C 588 165, 220 135, 220 188" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M588 110 C 588 150, 480 150, 480 188" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text class="ts" x="330" y="150" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">双方都愿意</text>
  <text class="ts" x="545" y="145" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">一方婉拒</text>
  <g class="c-green">
    <rect x="120" y="190" width="200" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="220" y="212" text-anchor="middle" dominant-baseline="central">第二次握手</text>
    <text class="ts" x="220" y="232" text-anchor="middle" dominant-baseline="central">互换意向封·解锁私密层</text>
  </g>
  <g class="c-gray">
    <rect x="380" y="190" width="200" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="480" y="212" text-anchor="middle" dominant-baseline="central">静默无痕</text>
    <text class="ts" x="480" y="232" text-anchor="middle" dominant-baseline="central">无任何被拒通知</text>
  </g>
</svg>