<svg viewBox="0 0 680 235" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; }
    text:not([fill]) { fill: #374151; }
    .th { font-size: 13px; font-weight: bold; fill: #1F2937; }
    .ts { font-size: 11px; fill: #374151; }
    .c-gray rect:not([fill]) { fill: #F3F4F6; }
    .c-red rect:not([fill]) { fill: #FBEAEC; }
    .c-green rect:not([fill]) { fill: #EAF6EF; }
    .c-amber rect:not([fill]) { fill: #FDF3E3; }
    rect:not([stroke]):not([stroke-width]) { stroke: #C8102E; }
    .c-gray rect:not([stroke]):not([stroke-width]) { stroke: #9CA3AF; }
    .c-red rect:not([stroke]):not([stroke-width]) { stroke: #C8102E; }
    .c-green rect:not([stroke]):not([stroke-width]) { stroke: #2E7D32; }
    .c-amber rect:not([stroke]):not([stroke-width]) { stroke: #B45A00; }
    .c-red .th:not([fill]) { fill: #C8102E; }
    .c-green .th:not([fill]) { fill: #2E7D32; }
    .c-amber .th:not([fill]) { fill: #B45A00; }
  </style>


  <title>红线广场模式：布告栏，不是舞会</title>
  <desc>月老把一阶名片贴到广场并拉取卡片池，本地过滤比对后向主人提交初阶报告；主人挑候选后月老生成升级请求封，广场定向投递给对方月老，对方主人独立决定。广场只存取、不筛选、不推送，月老们无需同时在线。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text class="th" x="40" y="34" dominant-baseline="central">广场模式：布告栏，不是舞会</text>
  <g class="c-gray">
    <rect x="40" y="80" width="110" height="90" rx="10" stroke-width="0.5"/>
    <text class="th" x="95" y="105" text-anchor="middle" dominant-baseline="central">主人</text>
    <text class="ts" x="95" y="128" text-anchor="middle" dominant-baseline="central">授权贴卡</text>
    <text class="ts" x="95" y="146" text-anchor="middle" dominant-baseline="central">挑候选·做决定</text>
  </g>
  <g class="c-red">
    <rect x="200" y="80" width="110" height="90" rx="10" stroke-width="0.5"/>
    <text class="th" x="255" y="105" text-anchor="middle" dominant-baseline="central">我的月老</text>
    <text class="ts" x="255" y="128" text-anchor="middle" dominant-baseline="central">本地过滤</text>
    <text class="ts" x="255" y="146" text-anchor="middle" dominant-baseline="central">比对·出报告</text>
  </g>
  <g class="c-red">
    <rect x="380" y="80" width="110" height="90" rx="10" stroke-width="0.5"/>
    <text class="th" x="435" y="105" text-anchor="middle" dominant-baseline="central">红线广场</text>
    <text class="ts" x="435" y="128" text-anchor="middle" dominant-baseline="central">加密卡片池</text>
    <text class="ts" x="435" y="146" text-anchor="middle" dominant-baseline="central">只存取·不筛选</text>
  </g>
  <g class="c-gray">
    <rect x="530" y="80" width="110" height="90" rx="10" stroke-width="0.5"/>
    <text class="th" x="585" y="105" text-anchor="middle" dominant-baseline="central">对方的月老</text>
    <text class="ts" x="585" y="128" text-anchor="middle" dominant-baseline="central">本地比对</text>
    <text class="ts" x="585" y="146" text-anchor="middle" dominant-baseline="central">主人独立决定</text>
  </g>
  <line x1="152" y1="125" x2="196" y2="125" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="312" y1="118" x2="376" y2="118" stroke="#A32D2D" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="492" y1="125" x2="526" y2="125" stroke="#A32D2D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="ts" x="345" y="60" text-anchor="middle" dominant-baseline="central">② 拉取卡片池</text>
  <text class="ts" x="510" y="60" text-anchor="middle" dominant-baseline="central">④ 定向投递升级封</text>
  <text class="ts" x="175" y="188" text-anchor="middle" dominant-baseline="central">报告·挑候选</text>
  <text class="ts" x="345" y="188" text-anchor="middle" dominant-baseline="central">① 贴卡 ③ 递升级封</text>
  <text class="ts" x="512" y="188" text-anchor="middle" dominant-baseline="central">拒绝静默照旧</text>
  <text class="ts" x="340" y="215" text-anchor="middle" dominant-baseline="central">广场 = 异步布告栏：月老们无需同时在线 · 服务端零排序零推送 · 卡带 TTL 随时撤</text>
</svg>