<svg viewBox="0 0 680 300" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <title>版本路线图 v1 → v2 → v3</title>
  <desc>v1 月老Skill+网站（客户端零服务端依赖）；v2 红线平台（双闸门：协议v1定稿+书面法律意见，法律意见只挡官方实例不挡代码与自托管）；v3 私有看板+小程序（需鹊桥主体）。kill criteria 在官方实例上线后生效。</desc>
  <defs>
    <marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C8102E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="300" fill="#FDFBF7"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#B02E35">版本路线图：v1 → v2 → v3</text>

  <!-- v1 -->
  <rect x="36" y="52" width="184" height="176" rx="10" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/>
  <rect x="36" y="52" width="184" height="30" rx="10" fill="#C8102E"/>
  <text x="128" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#FDFBF7">v1 · 现在（8 周）</text>
  <text x="50" y="102" font-size="11" fill="#1F2937">· 月老 Skill（MCP 包）</text>
  <text x="50" y="120" font-size="11" fill="#1F2937">· 建画像/匹配卡/互换/报告</text>
  <text x="50" y="138" font-size="11" fill="#1F2937">· 产品网站 hongxian.dev（已上线）</text>
  <text x="50" y="156" font-size="11" fill="#1F2937">· 协议规范 v0 草案公开</text>
  <text x="50" y="174" font-size="11" fill="#1F2937">· 匿名计数器（opt-in）</text>
  <text x="50" y="198" font-size="10" fill="#C8102E">架构：客户端零服务端依赖</text>
  <text x="50" y="214" font-size="10" fill="#C8102E">境内镜像站待 ICP 备案</text>

  <!-- v2 -->
  <rect x="248" y="52" width="184" height="176" rx="10" fill="#FFFFFF" stroke="#C8102E" stroke-width="2"/>
  <rect x="248" y="52" width="184" height="30" rx="10" fill="#C8102E"/>
  <text x="340" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#FDFBF7">v2 · 红线平台</text>
  <text x="262" y="102" font-size="11" fill="#1F2937">· 加密信箱 + 红线广场</text>
  <text x="262" y="120" font-size="11" fill="#1F2937">· 零 UI：一切经月老呈现</text>
  <text x="262" y="138" font-size="11" fill="#1F2937">· 联邦制 + docker 自托管</text>
  <text x="262" y="156" font-size="11" fill="#1F2937">· 官方实例（境内，Docker）</text>
  <text x="262" y="174" font-size="11" fill="#1F2937">· 数据三环制落地（含行为环）</text>
  <text x="262" y="198" font-size="10" fill="#B45A00">双闸门：协议 v1 定稿（已达成）</text>
  <text x="262" y="214" font-size="10" fill="#B45A00">+ 书面法律意见（仅挡官方实例）</text>

  <!-- v3 -->
  <rect x="460" y="52" width="184" height="176" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
  <rect x="460" y="52" width="184" height="30" rx="10" fill="#1F2937"/>
  <text x="552" y="72" text-anchor="middle" font-size="13" font-weight="bold" fill="#FDFBF7">v3 · 规模化后</text>
  <text x="474" y="102" font-size="11" fill="#1F2937">· 私有运营看板（仅聚合）</text>
  <text x="474" y="120" font-size="11" fill="#1F2937">· 小程序（需鹊桥公司主体）</text>
  <text x="474" y="138" font-size="11" fill="#1F2937">· 生态工具 / 第二实例联邦</text>
  <text x="474" y="156" font-size="11" fill="#1F2937">· 透明度年报</text>
  <text x="474" y="180" font-size="10" fill="#6B7280">kill criteria 于官方实例上线后</text>
  <text x="474" y="196" font-size="10" fill="#6B7280">生效：跌穿线 = 整改或关停实例，</text>
  <text x="474" y="212" font-size="10" fill="#6B7280">不往平台堆功能</text>

  <line x1="222" y1="140" x2="246" y2="140" stroke="#C8102E" stroke-width="2" marker-end="url(#ar3)"/>
  <line x1="434" y1="140" x2="458" y2="140" stroke="#C8102E" stroke-width="2" marker-end="url(#ar3)"/>

  <text x="340" y="256" text-anchor="middle" font-size="11" fill="#1F2937">验证命题（可证伪）：AI 介导的深度画像匹配，是否比刷脸式筛选产生更高的线下见面转化率</text>
  <text x="340" y="276" text-anchor="middle" font-size="11" fill="#C8102E">护城河 = 定位纯度 + 协议先发 + 信任资产 · 不设防抄，全力成为协议标准</text>
</svg>
