<svg viewBox="0 0 680 400" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <title>数据三环制</title>
  <desc>平台运营分析的数据边界：内容环（零知识，永不放松）、聚合环（匿名指标）、行为分析环（绑定密钥假名）。三环之间强制隔离，禁止合并画像。</desc>
  <rect x="0" y="0" width="680" height="400" fill="#FDFBF7"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#B02E35">数据三环制（2026-10-20 拍板）</text>

  <!-- 外环：行为分析环 -->
  <rect x="60" y="52" width="380" height="300" rx="16" fill="#FFFFFF" stroke="#F08200" stroke-width="2"/>
  <text x="80" y="76" font-size="13" font-weight="bold" fill="#B45A00">第三环 · 行为分析环（运营分析授权）</text>
  <text x="80" y="94" font-size="11" fill="#1F2937">使用频次 · 功能路径 · 设备类型</text>
  <text x="80" y="110" font-size="11" fill="#1F2937">一律绑定密钥假名 ID，禁止关联真实身份</text>
  <text x="80" y="126" font-size="11" fill="#1F2937">透明页明示 · v2 前须隐私声明 + 退出通道</text>

  <!-- 中环：聚合环 -->
  <rect x="92" y="146" width="316" height="186" rx="14" fill="#FBEAEC" stroke="#C8102E" stroke-width="2"/>
  <text x="110" y="170" font-size="13" font-weight="bold" fill="#C8102E">第二环 · 聚合环（匿名指标）</text>
  <text x="110" y="188" font-size="11" fill="#1F2937">建卡数 · 信件流量 · 广场热度 · 男女比</text>
  <text x="110" y="204" font-size="11" fill="#1F2937">对外形态 = 公开透明页（hongxian.dev）</text>

  <!-- 内环：内容环 -->
  <rect x="124" y="222" width="252" height="92" rx="12" fill="#1F2937"/>
  <text x="250" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#FDFBF7">第一环 · 内容环</text>
  <text x="250" y="266" text-anchor="middle" font-size="11" fill="#F9FAFB">信件 · 画像 · 偏好 —— 只存用户设备</text>
  <text x="250" y="282" text-anchor="middle" font-size="11" fill="#F9FAFB">平台只见密文 · 零知识 · 永不放松</text>
  <circle cx="250" cy="304" r="4" fill="#F08200"/>
  <text x="250" y="306" text-anchor="middle" font-size="1" fill="#1F2937"> </text>

  <!-- 右侧：环间隔离 -->
  <rect x="472" y="52" width="180" height="300" rx="10" fill="none" stroke="#1F2937" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="562" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#1F2937">环间隔离铁律</text>
  <text x="486" y="102" font-size="11" fill="#1F2937">三环数据不得合并画像：</text>
  <text x="486" y="128" font-size="11" fill="#C8102E">① 行为数据不得反推</text>
  <text x="486" y="144" font-size="11" fill="#C8102E">   内容偏好</text>
  <text x="486" y="168" font-size="11" fill="#C8102E">② 聚合数据不得还原</text>
  <text x="486" y="184" font-size="11" fill="#C8102E">   个体</text>
  <text x="486" y="208" font-size="11" fill="#C8102E">③ 假名 ID 不得关联</text>
  <text x="486" y="224" font-size="11" fill="#C8102E">   实名注册层</text>
  <line x1="486" y1="248" x2="638" y2="248" stroke="#1F2937" stroke-width="0.5"/>
  <text x="486" y="272" font-size="11" fill="#1F2937">实名与零知识共存：</text>
  <text x="486" y="290" font-size="11" fill="#1F2937">后台实名（注册层，</text>
  <text x="486" y="306" font-size="11" fill="#1F2937">依法加密持有）</text>
  <text x="486" y="322" font-size="11" fill="#1F2937">前台匿名 · 通信零知识</text>
  <text x="562" y="380" text-anchor="middle" font-size="10" fill="#6B7280">环越向外，平台可见越多；越向内，越接近"什么都不知</text>
</svg>
