<svg viewBox="0 0 680 420" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; }
    text:not([fill]) { fill: #374151; }
    .th { font-size: 13px; font-weight: bold; fill: #1F2937; }
    .ts { font-size: 11px; fill: #374151; }
    .c-gray rect:not([fill]) { fill: #F3F4F6; }
    .c-red rect:not([fill]) { fill: #FBEAEC; }
    .c-green rect:not([fill]) { fill: #EAF6EF; }
    .c-amber rect:not([fill]) { fill: #FDF3E3; }
    rect:not([stroke]):not([stroke-width]) { stroke: #C8102E; }
    .c-gray rect:not([stroke]):not([stroke-width]) { stroke: #9CA3AF; }
    .c-red rect:not([stroke]):not([stroke-width]) { stroke: #C8102E; }
    .c-green rect:not([stroke]):not([stroke-width]) { stroke: #2E7D32; }
    .c-amber rect:not([stroke]):not([stroke-width]) { stroke: #B45A00; }
    .c-red .th:not([fill]) { fill: #C8102E; }
    .c-green .th:not([fill]) { fill: #2E7D32; }
    .c-amber .th:not([fill]) { fill: #B45A00; }
  </style>


  <title>毕业轮：见面邀请与交接仪式</title>
  <desc>甲主人发起邀请封，乙月老呈报主人三态应答，同意则见面层对称互换，月老功成身退</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="340" y="32" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1F2937" font-family="sans-serif">毕业轮 · 见面邀请与交接仪式（D13）</text>
  <rect x="40" y="60" width="140" height="64" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="110" y="84" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#444441" font-family="sans-serif">甲主人发起</text>
  <text x="110" y="104" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="sans-serif">线下认识邀请</text>
  <rect x="220" y="60" width="180" height="64" rx="10" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="310" y="76" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#791F1F" font-family="sans-serif">邀请封</text>
  <text x="310" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F" font-family="sans-serif">主人亲笔短信（可选）</text>
  <text x="310" y="110" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F" font-family="sans-serif">月老可代拟草稿</text>
  <rect x="440" y="60" width="200" height="64" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="540" y="84" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#444441" font-family="sans-serif">乙月老呈报主人</text>
  <text x="540" y="104" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="sans-serif">附往轮信息摘要供决策</text>
  <path d="M180 92 L216 92" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M400 92 L436 92" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M540 124 L540 148 L545 148 L545 166" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M135 148 L545 148" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
  <path d="M135 148 L135 166" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M340 148 L340 166" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="170" width="190" height="56" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="135" y="190" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#791F1F" font-family="sans-serif">① 同意</text>
  <text x="135" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F" font-family="sans-serif">见面层对称互换</text>
  <rect x="245" y="170" width="190" height="56" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="340" y="190" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#444441" font-family="sans-serif">② 暂缓</text>
  <text x="340" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="sans-serif">继续深聊 · 无需理由</text>
  <rect x="450" y="170" width="190" height="56" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="545" y="190" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#444441" font-family="sans-serif">③ 婉拒</text>
  <text x="545" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="sans-serif">静默（与 D4 一致）</text>
  <path d="M135 226 L135 246" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="250" width="600" height="76" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="340" y="272" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#791F1F" font-family="sans-serif">见面层解锁（对称互换）</text>
  <text x="340" y="292" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F" font-family="sans-serif">联络方式主人自选（默认推荐微信号）· 真实姓名 · 工作单位</text>
  <text x="340" y="310" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F" font-family="sans-serif">见面锦囊 + 安全提示 + 反诈终检（涉及金钱 = 立即警惕）</text>
  <rect x="40" y="356" width="600" height="56" rx="10" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="340" y="376" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#791F1F" font-family="sans-serif">交接仪式：红线交到你们自己手里 —— 月老功成身退</text>
  <text x="340" y="396" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F" font-family="sans-serif">此后只做见面复盘与支持，不介入你们之间 · 反催促铁律：月老永不催促见面</text>
</svg>