<svg viewBox="0 0 680 300" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; }
    text:not([fill]) { fill: #374151; }
    .th { font-size: 13px; font-weight: bold; fill: #1F2937; }
    .ts { font-size: 11px; fill: #374151; }
    .cap { font-size: 10px; fill: #6B7280; }
    .box-a rect { fill: #FBEAEC; stroke: #C8102E; }
    .box-a .th { fill: #C8102E; }
    .box-b rect { fill: #EAF6EF; stroke: #2E7D32; }
    .box-b .th { fill: #2E7D32; }
    .box-m rect { fill: #F3F4F6; stroke: #9CA3AF; }
    .box-x rect { fill: #F1EFE8; stroke: #A32D2D; }
  </style>

  <title>声明式圈层：双向声明模型（D8 唯一分发模型）</title>
  <desc>左侧主人的月老持有拉取条件圈（我要看谁），右侧贴卡携带可见性声明圈（谁能看到我），中间是红线广场哑管道——服务端零筛选零排序零推送，过滤全部在客户端。五档半径模型作废：全网广播/介绍人链/主人圈群发/点对点递名片均已裁撤。</desc>

  <text class="th" x="340" y="26" text-anchor="middle" dominant-baseline="central">声明式圈层 = 分发半径唯一模型（双向声明）</text>

  <!-- 左：拉取条件圈 -->
  <g class="box-a">
    <rect x="24" y="46" width="200" height="198" rx="10" stroke-width="1.5"/>
    <text class="th" x="124" y="68" text-anchor="middle" dominant-baseline="central">A 拉取条件圈</text>
    <text class="ts" x="124" y="86" text-anchor="middle" dominant-baseline="central" font-weight="bold">我要看谁（主人声明）</text>
    <text class="ts" x="40" y="108" dominant-baseline="central">● 地理圈：本市/本省/多选/全国</text>
    <text class="ts" x="40" y="128" dominant-baseline="central">● 年龄段：受控区间多选</text>
    <text class="ts" x="40" y="148" dominant-baseline="central">● 性别方向：female/male/all</text>
    <text class="ts" x="40" y="168" dominant-baseline="central">● 婚况（可选）unmarried/divorced</text>
    <text class="ts" x="40" y="188" dominant-baseline="central">● 职业大类 / 兴趣标签（可选）</text>
    <text class="cap" x="124" y="214" text-anchor="middle" dominant-baseline="central">月老拉回卡片池后本地过滤</text>
    <text class="cap" x="124" y="230" text-anchor="middle" dominant-baseline="central">（v2.0 服务端零筛选）</text>
  </g>

  <!-- 中：红线广场哑管道 -->
  <g class="box-m">
    <rect x="258" y="76" width="164" height="122" rx="10" stroke-width="1.5"/>
    <text class="th" x="340" y="98" text-anchor="middle" dominant-baseline="central">红线广场</text>
    <text class="ts" x="340" y="117" text-anchor="middle" dominant-baseline="central">哑管道 · 布告栏</text>
    <text class="ts" x="340" y="139" text-anchor="middle" dominant-baseline="central">零筛选 · 零排序 · 零推送</text>
    <text class="ts" x="340" y="157" text-anchor="middle" dominant-baseline="central">全量池按时间序分页</text>
    <text class="ts" x="340" y="175" text-anchor="middle" dominant-baseline="central">过滤 100% 在客户端</text>
    <circle cx="340" cy="90" r="3" fill="#F08200"/>
  </g>

  <!-- 右：可见性声明圈 -->
  <g class="box-b">
    <rect x="456" y="46" width="200" height="198" rx="10" stroke-width="1.5"/>
    <text class="th" x="556" y="68" text-anchor="middle" dominant-baseline="central">B 可见性声明圈</text>
    <text class="ts" x="556" y="86" text-anchor="middle" dominant-baseline="central" font-weight="bold">谁能看到我（主人声明）</text>
    <text class="ts" x="472" y="108" dominant-baseline="central">● 与 A 组同词表，对称镜像</text>
    <text class="ts" x="472" y="128" dominant-baseline="central">● 随广场贴卡发布</text>
    <text class="ts" x="472" y="148" dominant-baseline="central">● v2.0：请求性声明</text>
    <text class="ts" x="484" y="164" dominant-baseline="central">（对方月老按守则尊重）</text>
    <text class="ts" x="472" y="182" dominant-baseline="central">● Schema v0.5：升格为</text>
    <text class="ts" x="484" y="198" dominant-baseline="central">服务端机械强制过滤</text>
    <text class="cap" x="556" y="220" text-anchor="middle" dominant-baseline="central">默认本市 · 最小暴露</text>
  </g>

  <!-- 连接箭头 -->
  <g stroke="#C8102E" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 227 128 L 253 128"/>
    <path d="M 248 123 L 253 128 L 248 133"/>
    <path d="M 427 128 L 451 128"/>
    <path d="M 446 123 L 451 128 L 446 133"/>
  </g>

  <!-- 底部铁律条 -->
  <g class="box-x">
    <rect x="24" y="258" width="632" height="32" rx="8" stroke-width="1"/>
  </g>
  <text class="ts" x="340" y="274" text-anchor="middle" dominant-baseline="central" font-weight="bold">铁律：双向声明都由用户自己定，平台只递信、不画圈 · 全网广播/介绍人链/主人圈群发/点对点递名片已全部裁撤</text>
</svg>
