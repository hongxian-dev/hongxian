<svg viewBox="0 0 680 230" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>名片分发半径：五档策略，全网广播永不采纳</title>
  <desc>五档分发策略从窄到宽：点对点递名片、主人圈群发、介绍人链、声明式圈层（v2 协议），每档范围决策权都在用户手里；第五档全网广播由平台画圈，永不采纳。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text class="th" x="40" y="34" dominant-baseline="central">名片分发半径：从窄到宽，第五档永不采纳</text>
  <g class="c-gray">
    <rect x="40" y="70" width="112" height="110" rx="10" stroke-width="0.5"/>
    <text class="th" x="96" y="92" text-anchor="middle" dominant-baseline="central">点对点递名片</text>
    <text class="ts" x="96" y="114" text-anchor="middle" dominant-baseline="central">v1 · 当面/传文件</text>
    <text class="ts" x="96" y="134" text-anchor="middle" dominant-baseline="central">范围：一个人</text>
    <text class="ts" x="96" y="152" text-anchor="middle" dominant-baseline="central">信任：当面建立</text>
  </g>
  <g class="c-gray">
    <rect x="162" y="70" width="112" height="110" rx="10" stroke-width="0.5"/>
    <text class="th" x="218" y="92" text-anchor="middle" dominant-baseline="central">主人圈群发</text>
    <text class="ts" x="218" y="114" text-anchor="middle" dominant-baseline="central">v1 · 自己发进群</text>
    <text class="ts" x="218" y="134" text-anchor="middle" dominant-baseline="central">范围：主人自己画</text>
    <text class="ts" x="218" y="152" text-anchor="middle" dominant-baseline="central">月老只导出不管发</text>
  </g>
  <g class="c-gray">
    <rect x="284" y="70" width="112" height="110" rx="10" stroke-width="0.5"/>
    <text class="th" x="340" y="92" text-anchor="middle" dominant-baseline="central">介绍人链</text>
    <text class="ts" x="340" y="114" text-anchor="middle" dominant-baseline="central">共同好友的月老</text>
    <text class="ts" x="340" y="134" text-anchor="middle" dominant-baseline="central">做中介递卡</text>
    <text class="ts" x="340" y="152" text-anchor="middle" dominant-baseline="central">信任：介绍人背书</text>
  </g>
  <g class="c-red">
    <rect x="406" y="70" width="112" height="110" rx="10" stroke-width="0.5"/>
    <text class="th" x="462" y="92" text-anchor="middle" dominant-baseline="central">声明式圈层</text>
    <text class="ts" x="462" y="114" text-anchor="middle" dominant-baseline="central">v2 · 卡片自带</text>
    <text class="ts" x="462" y="134" text-anchor="middle" dominant-baseline="central">范围声明（如同城）</text>
    <text class="ts" x="462" y="152" text-anchor="middle" dominant-baseline="central">服务端只递不选</text>
  </g>
  <g>
    <rect x="528" y="70" width="112" height="110" rx="10" fill="#F1EFE8" stroke="#A32D2D" stroke-width="1" stroke-dasharray="5 3"/>
    <text class="th" x="584" y="92" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">全网广播</text>
    <text class="ts" x="584" y="114" text-anchor="middle" dominant-baseline="central">平台画圈 · 全员投递</text>
    <text class="ts" x="584" y="134" text-anchor="middle" dominant-baseline="central">定位穿帮 · 骗子放大器</text>
    <text class="ts" x="584" y="154" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">永不采纳</text>
  </g>
  <line x1="152" y1="125" x2="160" y2="125" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="274" y1="125" x2="282" y2="125" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="396" y1="125" x2="404" y2="125" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <line x1="518" y1="125" x2="526" y2="125" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text class="ts" x="340" y="208" text-anchor="middle" dominant-baseline="central">铁律：范围决策权永远在用户手里 · 平台只递信不画圈 · 不建在线状态系统（presence 即追踪）</text>
</svg>