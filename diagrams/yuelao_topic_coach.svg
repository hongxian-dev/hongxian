<svg viewBox="0 0 680 410" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; }
    text:not([fill]) { fill: #374151; }
    .th { font-size: 13px; font-weight: bold; fill: #1F2937; }
    .ts { font-size: 11px; fill: #374151; }
    .c-gray rect:not([fill]) { fill: #F3F4F6; }
    .c-red rect:not([fill]) { fill: #FBEAEC; }
    .c-green rect:not([fill]) { fill: #EAF6EF; }
    .c-amber rect:not([fill]) { fill: #FDF3E3; }
    rect:not([stroke]):not([stroke-width]) { stroke: #C8102E; }
    .c-gray rect:not([stroke]):not([stroke-width]) { stroke: #9CA3AF; }
    .c-red rect:not([stroke]):not([stroke-width]) { stroke: #C8102E; }
    .c-green rect:not([stroke]):not([stroke-width]) { stroke: #2E7D32; }
    .c-amber rect:not([stroke]):not([stroke-width]) { stroke: #B45A00; }
    .c-red .th:not([fill]) { fill: #C8102E; }
    .c-green .th:not([fill]) { fill: #2E7D32; }
    .c-amber .th:not([fill]) { fill: #B45A00; }
  </style>


  <title>增量报告的选题教练板块</title>
  <desc>月老在每轮增量报告中附选题建议，主人可选用、修改或自己出题，技巧使用设伦理护栏</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="340" y="32" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#1F2937" font-family="sans-serif">增量小报告 · 选题教练板块（D12）</text>
  <rect x="40" y="52" width="280" height="150" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="180" y="76" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#444441" font-family="sans-serif">增量小报告（每轮）</text>
  <text x="180" y="100" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="sans-serif">共鸣 / 差异 / 预警（D6 三区）</text>
  <text x="180" y="120" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A" font-family="sans-serif">置信度变化 · 建议</text>
  <rect x="56" y="136" width="248" height="52" rx="8" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="180" y="154" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#791F1F" font-family="sans-serif">下一轮选题（新增）</text>
  <text x="180" y="174" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F" font-family="sans-serif">月老拟 2–3 题 + 出题理由</text>
  <rect x="400" y="64" width="240" height="56" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="520" y="86" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#791F1F" font-family="sans-serif">① 选用</text>
  <text x="520" y="106" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F" font-family="sans-serif">优先进入下一轮考题包</text>
  <rect x="400" y="136" width="240" height="56" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="520" y="158" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#791F1F" font-family="sans-serif">② 修改后使用</text>
  <text x="520" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F" font-family="sans-serif">微调措辞或方向</text>
  <rect x="400" y="208" width="240" height="56" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="520" y="230" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#791F1F" font-family="sans-serif">③ 主人自己出题</text>
  <text x="520" y="250" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F" font-family="sans-serif">标记「主人想问的」</text>
  <path d="M320 150 L396 92" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M320 150 L396 164" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M320 150 L396 236" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="280" width="290" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="185" y="302" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441" font-family="sans-serif">主人亲定的题 → 标记「主人想问的」</text>
  <rect x="350" y="280" width="290" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="495" y="302" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#444441" font-family="sans-serif">题库自动出题 → 标记「月老建议的」</text>
  <rect x="40" y="340" width="600" height="56" rx="10" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="340" y="360" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#791F1F" font-family="sans-serif">伦理护栏：技巧只用于促进真实了解</text>
  <text x="340" y="382" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#791F1F" font-family="sans-serif">开放式提问 · 安全节奏 · 化解尴尬 —— 禁止伪装人设与操纵话术</text>
</svg>