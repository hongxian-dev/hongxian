<svg viewBox="0 0 680 240" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; }
    text:not([fill]) { fill: #374151; }
    .th { font-size: 13px; font-weight: bold; fill: #1F2937; }
    .ts { font-size: 11px; fill: #374151; }
    .c-gray rect:not([fill]) { fill: #F3F4F6; }
    .c-red rect:not([fill]) { fill: #FBEAEC; }
    .c-green rect:not([fill]) { fill: #EAF6EF; }
    .c-amber rect:not([fill]) { fill: #FDF3E3; }
    rect:not([stroke]):not([stroke-width]) { stroke: #C8102E; }
    .c-gray rect:not([stroke]):not([stroke-width]) { stroke: #9CA3AF; }
    .c-red rect:not([stroke]):not([stroke-width]) { stroke: #C8102E; }
    .c-green rect:not([stroke]):not([stroke-width]) { stroke: #2E7D32; }
    .c-amber rect:not([stroke]):not([stroke-width]) { stroke: #B45A00; }
    .c-red .th:not([fill]) { fill: #C8102E; }
    .c-green .th:not([fill]) { fill: #2E7D32; }
    .c-amber .th:not([fill]) { fill: #B45A00; }
  </style>


  <title>红线 v1 通信模型：月老与主人、月老与月老的连接方式</title>
  <desc>两位主人各自与自己的月老日常对话、接收报告；两位月老之间仅有两次结构化握手（互换加密名片、互换意向封），没有自由聊天；全程无服务器，所有连线走本地设备或当面信道。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g class="c-gray">
    <rect x="40" y="80" width="110" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="95" y="102" text-anchor="middle" dominant-baseline="central">主人甲</text>
    <text class="ts" x="95" y="122" text-anchor="middle" dominant-baseline="central">提出需求·做决定</text>
  </g>
  <g class="c-red">
    <rect x="205" y="80" width="110" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="260" y="102" text-anchor="middle" dominant-baseline="central">月老甲</text>
    <text class="ts" x="260" y="122" text-anchor="middle" dominant-baseline="central">建画像·比对·汇报</text>
  </g>
  <g class="c-red">
    <rect x="370" y="80" width="110" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="425" y="102" text-anchor="middle" dominant-baseline="central">月老乙</text>
    <text class="ts" x="425" y="122" text-anchor="middle" dominant-baseline="central">建画像·比对·汇报</text>
  </g>
  <g class="c-gray">
    <rect x="530" y="80" width="110" height="60" rx="8" stroke-width="0.5"/>
    <text class="th" x="585" y="102" text-anchor="middle" dominant-baseline="central">主人乙</text>
    <text class="ts" x="585" y="122" text-anchor="middle" dominant-baseline="central">提出需求·做决定</text>
  </g>
  <line x1="152" y1="110" x2="201" y2="110" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="317" y1="110" x2="366" y2="110" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <line x1="482" y1="110" x2="526" y2="110" stroke="#5F5E5A" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text class="ts" x="342" y="42" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">第一次握手：互换加密名片</text>
  <text class="ts" x="342" y="62" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">第二次握手：互换意向封</text>
  <text class="ts" x="177" y="162" text-anchor="middle" dominant-baseline="central">日常对话·报告·复盘</text>
  <text class="ts" x="342" y="162" text-anchor="middle" dominant-baseline="central">仅结构化握手，无自由聊天</text>
  <text class="ts" x="504" y="162" text-anchor="middle" dominant-baseline="central">日常对话·报告·复盘</text>
  <text class="ts" x="340" y="205" text-anchor="middle" dominant-baseline="central">v1 全程无服务器 · 每条连线都走本地设备或当面信道</text>
</svg>