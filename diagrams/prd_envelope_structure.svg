<svg viewBox="0 0 680 420" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <title>匹配卡信封结构与密钥体系</title>
  <desc>一张匹配卡=一个信封文件：明文meta+三层独立加密payload+Ed25519整体签名。右侧密钥体系：身份密钥对签名、X25519换卡即换公钥、三层密钥各自独立、grant类信封只交付密钥不解密文。</desc>
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#C8102E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="420" fill="#FDFBF7"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#B02E35">匹配卡信封结构 与 密钥体系（Schema v0.4）</text>

  <!-- 左：信封结构 -->
  <rect x="40" y="50" width="280" height="340" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.5"/>
  <text x="180" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#1F2937">MatchCard Envelope（.hongxian-card）</text>
  <rect x="56" y="88" width="248" height="58" rx="6" fill="#F3F4F6" stroke="#1F2937" stroke-width="0.8"/>
  <text x="66" y="106" font-size="11" font-weight="bold" fill="#1F2937">meta（明文，任何人可读）</text>
  <text x="66" y="122" font-size="10" fill="#1F2937">card_id(UUIDv7) · 公钥指纹 · version · TTL</text>
  <text x="66" y="137" font-size="10" fill="#1F2937">画像深度标记 · 介绍人背书(可选) · algo</text>
  <rect x="56" y="154" width="248" height="52" rx="6" fill="#FBEAEC" stroke="#C8102E" stroke-width="1.2"/>
  <text x="66" y="172" font-size="11" font-weight="bold" fill="#C8102E">payload_L1 公开层（AES-256-GCM）</text>
  <text x="66" y="188" font-size="10" fill="#1F2937">昵称·性别·年龄段·城市·婚况·职业·兴趣·目标</text>
  <text x="66" y="201" font-size="10" fill="#1F2937">econ_signal 经济状态自述（默认 undisclosed）</text>
  <rect x="56" y="214" width="248" height="58" rx="6" fill="#F7C1C1" stroke="#C8102E" stroke-width="1.2"/>
  <text x="66" y="232" font-size="11" font-weight="bold" fill="#C8102E">payload_L2 匹配层（AES-256-GCM）</text>
  <text x="66" y="248" font-size="10" fill="#1F2937">价值观标签·生活方式·家庭观·消费观·房车概况</text>
  <text x="66" y="261" font-size="10" fill="#1F2937">dealbreakers 负面清单 · 价值观问答原文</text>
  <rect x="56" y="280" width="248" height="52" rx="6" fill="#C8102E"/>
  <text x="66" y="298" font-size="11" font-weight="bold" fill="#FDFBF7">payload_L3 私密层（整体可缺省）</text>
  <text x="66" y="314" font-size="10" fill="#F9FAFB">微信号(默认开)·手机号·姓名·单位·照片引用</text>
  <text x="66" y="327" font-size="10" fill="#F9FAFB">逐字段 opt-in：可以"给微信不给手机号"</text>
  <rect x="56" y="340" width="248" height="34" rx="6" fill="#1F2937"/>
  <text x="180" y="361" text-anchor="middle" font-size="11" font-weight="bold" fill="#FDFBF7">signature · Ed25519（对 meta + 三密文整体签名）</text>

  <!-- 右：密钥体系 -->
  <rect x="360" y="50" width="280" height="340" rx="10" fill="none" stroke="#C8102E" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="500" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#C8102E">密钥体系（v1 建全 → v2 零迁移）</text>
  <rect x="376" y="90" width="248" height="56" rx="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.2"/>
  <text x="386" y="110" font-size="11" font-weight="bold" fill="#1F2937">身份密钥对 · Ed25519</text>
  <text x="386" y="126" font-size="10" fill="#1F2937">私钥永不出设备 · 卡片与一切信封签名</text>
  <text x="386" y="139" font-size="10" fill="#1F2937">验签失败 = 整卡作废（防伪造）</text>
  <rect x="376" y="158" width="248" height="56" rx="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.2"/>
  <text x="386" y="178" font-size="11" font-weight="bold" fill="#1F2937">加密协商 · X25519</text>
  <text x="386" y="194" font-size="10" fill="#1F2937">第一次握手 = 换卡即换公钥</text>
  <text x="386" y="207" font-size="10" fill="#1F2937">此后定向信封用收件人公钥 sealed box</text>
  <rect x="376" y="226" width="248" height="56" rx="6" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.2"/>
  <text x="386" y="246" font-size="11" font-weight="bold" fill="#1F2937">层密钥 key_L1 / L2 / L3</text>
  <text x="386" y="262" font-size="10" fill="#1F2937">本地生成 · 三层各自独立加密</text>
  <text x="386" y="275" font-size="10" fill="#1F2937">grant 类信封只交付密钥，不解密文</text>
  <rect x="376" y="294" width="248" height="56" rx="6" fill="#FFFFFF" stroke="#F08200" stroke-width="1.2"/>
  <text x="386" y="314" font-size="11" font-weight="bold" fill="#B45A00">备份与恢复（恢复短语即身份）</text>
  <text x="386" y="330" font-size="10" fill="#1F2937">BIP39 24 词 → Argon2id → 三种子密钥</text>
  <text x="386" y="343" font-size="10" fill="#1F2937">首次访谈强制完成备份 · 丢失不可找回</text>

  <line x1="322" y1="220" x2="358" y2="220" stroke="#C8102E" stroke-width="1.5" marker-end="url(#ar2)"/>
  <text x="340" y="406" text-anchor="middle" font-size="11" fill="#1F2937">服务端 / 中转者全程只见密文 —— 零知识不是承诺，是数学结构</text>
</svg>
