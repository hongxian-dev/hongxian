<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- 红线 · 主标志 M1「线球小月老」｜与 brand/avatar-source.svg 同构图，仅去掉纸白底以符合市场「背景透明」要求。
       缩放 0.80 → 1.05 并按实际包围盒（含甩出的爱心 x39–222 / y59–195，中心 130.5,127）重新居中：
       0.80 在 64px 市场图标下内容只占六成，显得弱。 -->
  <g transform="translate(120,120) scale(1.05) translate(-130.5,-127)">
    <!-- 毛线球身体 -->
    <circle cx="104" cy="128" r="66" fill="#C8102E"/>
    <!-- 甩出轮廓的 loose 线头（毛线球关键识别符） -->
    <path d="M 148 78 C 158 64 174 62 179 72 C 183 81 174 90 165 85" fill="none" stroke="#C8102E" stroke-width="6" stroke-linecap="round"/>
    <!-- 缠线两笔（让出面部与额头带） -->
    <path d="M 152 92 C 174 106 178 130 166 148" fill="none" stroke="#EF8A97" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 52 170 C 84 192 132 190 166 166" fill="none" stroke="#EF8A97" stroke-width="5.5" stroke-linecap="round"/>
    <!-- 额印 · AI 星芒 -->
    <path d="M 104 93 L 106.5 101.5 L 115 104 L 106.5 106.5 L 104 115 L 101.5 106.5 L 93 104 L 101.5 101.5 Z" fill="#F08200"/>
    <!-- 脸 -->
    <circle cx="82" cy="140" r="14" fill="#FDFBF7"/>
    <circle cx="126" cy="140" r="14" fill="#FDFBF7"/>
    <circle cx="85" cy="142" r="6.5" fill="#1F2937"/>
    <circle cx="123" cy="142" r="6.5" fill="#1F2937"/>
    <circle cx="87" cy="139" r="2.2" fill="#FDFBF7"/>
    <circle cx="125" cy="139" r="2.2" fill="#FDFBF7"/>
    <path d="M 94 162 Q 104 172 114 162" fill="none" stroke="#FDFBF7" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="62" cy="156" rx="8" ry="5" fill="#F08200" opacity="0.55"/>
    <ellipse cx="146" cy="156" rx="8" ry="5" fill="#F08200" opacity="0.55"/>
    <!-- 线头"手"递出爱心 -->
    <path d="M 166 142 C 186 146 196 138 199 126" fill="none" stroke="#C8102E" stroke-width="6" stroke-linecap="round"/>
    <path d="M 204 124 C 194 117 189 110 189 104 C 189 98 194 95 199 97 C 202 98 203.5 101 204 103.5 C 204.5 101 206 98 209 97 C 214 95 219 98 219 104 C 219 110 214 117 204 124 Z" fill="#C8102E"/>
  </g>
</svg>
