#   大陆身份无法开通，因此唯一通道为爱发电（afdian.com，实名 + 支付宝/微信）。
#
# 合规纪律（定位声明 §12.1 第 4 条，2026-10-21 定稿）：
#   ① 只经第三方平台代收，站内与仓库 README 均不投放个人收款码/赞赏码图片；
#   ② 措辞只用「赞助 / 打赏」，禁用「礼金 / 谢媒礼 / 彩礼 / 介绍费」；
#   ③ 必须声明赞助不换取任何服务、优先权或匹配机会，不构成对价。
