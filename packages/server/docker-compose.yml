# 红线平台服务 · 一键自托管（docker compose）
#
# 用法：
#   docker compose up -d
#   curl http://127.0.0.1:8787/healthz
#
# 数据全部在 ./data 卷（密文 + opaque ID + 公钥）。删卷即删库。
# 本服务不出网、不追踪、无日志外发；零知识——运营者改代码也只能拿到密文。

services:
  plaza:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
    environment:
      # 实例域名：客户端寻址 opaque_id@instance 用（自托管可填自己的域名或 IP）
      HONGXIAN_INSTANCE: ${HONGXIAN_INSTANCE:-localhost}
      PORT: "8787"
    restart: unless-stopped
    # 只绑定本地+内网：默认不直接暴露公网（前置反代/证书由运营者自决）
    # 如需公网：自行加反代（Caddy/nginx）与 TLS，并知悉你将成为运营者
