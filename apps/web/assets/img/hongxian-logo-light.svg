<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img">
  <title>红线 Hongxian 主标志（亮色）</title>
  <desc>加权心络：神经网络风格的心形图，边的粗细与深浅代表注意力权重，底部虚线连接两个 Agent 节点。</desc>
  <g fill="none" stroke="#C8102E" stroke-linecap="round">
    <path d="M 50 80 L 80 50 L 110 80 L 140 50 L 170 80 L 162.9 99.3 L 110 162.5 L 57.1 99.3 Z" stroke-width="3.5"/>
    <path d="M 80 50 L 110 80" stroke-width="2" opacity="0.65"/>
    <path d="M 140 50 L 110 80" stroke-width="2" opacity="0.65"/>
    <path d="M 57.1 99.3 L 110 162.5" stroke-width="1.8" opacity="0.45"/>
    <path d="M 162.9 99.3 L 110 162.5" stroke-width="1.8" opacity="0.45"/>
    <path d="M 80 50 L 140 50" stroke-width="1.5" opacity="0.55" stroke-dasharray="2 5"/>
  </g>
  <g stroke="#C8102E" stroke-width="2.5" fill="none" stroke-dasharray="3 6">
    <path d="M 110 162.5 L 75 195"/>
    <path d="M 110 162.5 L 145 195"/>
  </g>
  <g fill="#1F2937">
    <circle cx="50" cy="80" r="6"/><circle cx="80" cy="50" r="6.5"/><circle cx="110" cy="80" r="8.5"/>
    <circle cx="140" cy="50" r="6.5"/><circle cx="170" cy="80" r="6"/><circle cx="162.9" cy="99.3" r="5.5"/>
    <circle cx="57.1" cy="99.3" r="5.5"/><circle cx="110" cy="162.5" r="8"/>
  </g>
  <circle cx="110" cy="80" r="3.2" fill="#F08200"/>
  <g fill="#FDFBF7" stroke="#1F2937" stroke-width="3">
    <circle cx="75" cy="195" r="9"/><circle cx="145" cy="195" r="9"/>
  </g>
  <text x="250" y="112" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="64" font-weight="700" fill="#1F2937">红线</text>
  <text x="253" y="146" font-family="Arial,sans-serif" font-size="17" font-weight="500" letter-spacing="6" fill="#B02E35">HONGXIAN</text>
</svg>
