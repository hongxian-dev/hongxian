name = "hongxian-counter"
main = "src/index.js"
compatibility_date = "2026-10-15"

# KV 命名空间：hongxian-counter-kv
# ⚠️ 公开仓库里保持占位符。自建后执行 `npx wrangler kv namespace create hongxian-counter-kv`
#    把返回的 id 填到这里（本地部署用，注意别把真实 id 提交上去）。
[[kv_namespaces]]
binding = "COUNTER"
id = "<KV_NAMESPACE_ID>"

[vars]
# 工作量证明难度：sha256 十六进制前导零个数（1-8）。4 ≈ 6.5 万次哈希，浏览器/Node 毫秒级
POW_DIFFICULTY = "4"

# 注意：RL_SALT（限速哈希盐）属于机密，勿写入本文件。
# 部署前执行：npx wrangler secret put RL_SALT
